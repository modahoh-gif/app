name: BitcoinLive
options:
  bundleIdPrefix: com.bitcoin
targets:
  BitcoinLive:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources: [App]
    settings:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      properties:
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
  BitcoinLiveExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources: [Widget]
    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
