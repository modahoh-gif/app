name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build App Directly
        run: |
          swift package init --type application || true
          # إنشاء مشروع خفيف وملف Xcode مباشرة بدون تعقيد
          cat << 'EOF' > generate_project.swift
          import Foundation
          // سيتم تجميع الملفات مباشرة عبر xcodebuild
          EOF
          
          xcodebuild -newXcodeProject -name BitcoinLive -target BitcoinLive -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" || true
          
          # بناء مباشر للملفات الموجودة في مجلد App
          xcodebuild -project BitcoinLive.xcodeproj -scheme BitcoinLive -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
          
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r app.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinLiveApp
          path: app.ipa
