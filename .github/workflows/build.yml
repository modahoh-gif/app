name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build with Swift Package
        run: |
          # تجهيز هيكل التطبيق وبناء الملفات البرمجية مباشرة
          mkdir -p Sources/BitcoinLive
          cp -R App/* Sources/BitcoinLive/ || true
          
          # إنشاء ملف Package.swift خفيف
          cat << 'EOF' > Package.swift
          // swift-tools-version: 5.8
          import PackageDescription
          let package = Package(
              name: "BitcoinLive",
              platforms: [.iOS(.v16)],
              products: [.library(name: "BitcoinLive", targets: ["BitcoinLive"])],
              targets: [.target(name: "BitcoinLive", path: "Sources/BitcoinLive")]
          )
          EOF
          
          # بناء التطبيق واستخراج الـ IPA
          swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-ios16.2
          
          mkdir -p Payload/BitcoinLive.app
          cp -f .build/release/BitcoinLive Payload/BitcoinLive.app/BitcoinLive
          
          # ملف Info.plist أساسي لتشغيل التطبيق
          cat << 'EOF' > Payload/BitcoinLive.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          dict>
              <key>CFBundleIdentifier</key>
              <string>com.bitcoin.live</string>
              <key>CFBundleName</key>
              <string>BitcoinLive</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>MinimumOSVersion</key>
              <string>16.2</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
          </dict>
          </plist>
          EOF
          
          zip -r app.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinLiveApp
          path: app.ipa
