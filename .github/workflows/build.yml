name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create and Build Everything
        run: |
          mkdir -p Sources/BitcoinLive
          
          cat << 'EOF' > Sources/BitcoinLive/BitcoinAttributes.swift
          import ActivityKit
          import Foundation

          public struct BitcoinAttributes: ActivityAttributes {
              public struct ContentState: Codable, Hashable {
                  public var price: String
                  public init(price: String) { self.price = price }
              }
              public var pair: String
              public init(pair: String) { self.pair = pair }
          }
          EOF

          cat << 'EOF' > Sources/BitcoinLive/BitcoinManager.swift
          import Foundation
          import ActivityKit
          import AVFoundation

          public class BitcoinManager: ObservableObject {
              @Published public var currentPrice: String = "Connecting..."
              private var webSocket: URLSessionWebSocketTask?
              private var engine = AVAudioEngine()
              private var player = AVAudioPlayerNode()
              private var activity: Activity<BitcoinAttributes>?

              public init() {}

              public func start() {
                  startSilentAudio()
                  startActivity()
                  connectWebSocket()
              }

              private func startSilentAudio() {
                  try? AVAudioSession.sharedInstance().setCategory(.playback, options: .mixWithOthers)
                  try? AVAudioSession.sharedInstance().setActive(true)
                  engine.attach(player)
                  let format = AVAudioFormat(standardFormatWithSampleRate: 44100, channels: 1)!
                  engine.connect(player, to: engine.mainMixerNode, format: format)
                  try? engine.start()
                  player.play()
              }

              private func startActivity() {
                  let attributes = BitcoinAttributes(pair: "BTC/USDT")
                  let initialState = BitcoinAttributes.ContentState(price: "Connecting...")
                  let content = ActivityContent(state: initialState, staleDate: nil)
                  activity = try? Activity.request(attributes: attributes, content: content)
              }

              private func connectWebSocket() {
                  let url = URL(string: "wss://stream.binance.com:9443/ws/btcusdt@ticker")!
                  webSocket = URLSession.shared.webSocketTask(with: url)
                  webSocket?.resume()
                  receiveMessage()
              }

              private func receiveMessage() {
                  webSocket?.receive { [weak self] result in
                      switch result {
                      case .success(let message):
                          if case .string(let text) = message,
                             let data = text.data(using: .utf8),
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let priceStr = json["c"] as? String {
                              let doublePrice = Double(priceStr) ?? 0
                              let formattedPrice = String(format: "$%.1f", doublePrice)
                              DispatchQueue.main.async {
                                  self?.currentPrice = formattedPrice
                              }
                              Task { await self?.activity?.update(ActivityContent(state: .init(price: formattedPrice), staleDate: nil)) }
                          }
                          self?.receiveMessage()
                      case .failure:
                          DispatchQueue.main.asyncAfter(deadline: .now() + 2) { self?.connectWebSocket() }
                      }
                  }
              }
          }
          EOF

          # استبدال الـ main.swift بواجهة SwiftUI حقيقية تمنع الشاشة السوداء
          cat << 'EOF' > Sources/BitcoinLive/main.swift
          import SwiftUI

          @AppStorage("isStarted") var autoStart = false

          struct ContentView: View {
              @StateObject var manager = BitcoinManager()

              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()
                      VStack(spacing: 20) {
                          Text("Bitcoin Live Tracker")
                              .font(.largeTitle)
                              .bold()
                              .foregroundColor(.white)
                          
                          Text(manager.currentPrice)
                              .font(.system(size: 40, weight: .bold))
                              .foregroundColor(.green)
                          
                          Button(action: {
                              manager.start()
                          }) {
                              Text("Start Live Activity & Audio")
                                  .font(.headline)
                                  .padding()
                                  .background(Color.orange)
                                  .foregroundColor(.white)
                                  .cornerRadius(12)
                          }
                      }
                      .padding()
                  }
              }
          }

          @main
          struct AppMain: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat << 'EOF' > Package.swift
          // swift-tools-version: 5.8
          import PackageDescription
          let package = Package(
              name: "BitcoinLive",
              platforms: [.iOS(.v16)],
              products: [
                  .executable(name: "BitcoinLive", targets: ["BitcoinLive"])
              ],
              targets: [
                  .executableTarget(
                      name: "BitcoinLive",
                      path: "Sources/BitcoinLive",
                      linkerSettings: [.linkedFramework("ActivityKit"), .linkedFramework("AVFoundation"), .linkedFramework("SwiftUI")]
                  )
              ]
          )
          EOF

          swift build -c release --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -Xswiftc -target -Xswiftc arm64-apple-ios16.2
          
          mkdir -p Payload/BitcoinLive.app
          cp -f .build/arm64-apple-ios/release/BitcoinLive Payload/BitcoinLive.app/BitcoinLive || cp -f .build/release/BitcoinLive Payload/BitcoinLive.app/BitcoinLive
          
          cat << 'EOF' > Payload/BitcoinLive.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.bitcoin.live</string>
              <key>CFBundleName</key>
              <string>BitcoinLive</string>
              <key>CFBundleExecutable</key>
              <string>BitcoinLive</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>MinimumOSVersion</key>
              <string>16.2</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
          </dict>
          </plist>
          EOF
          
          zip -r app.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinLiveApp
          path: app.ipa
